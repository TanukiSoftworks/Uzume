[package]
name = "uzume"
version = "1.1.0"
edition = "2021"
description = "Discord music presence for Windows via SMTC"
authors = ["Tanuki Softworks <luis.sepulveda@tanukisoftworks.com>"]
homepage = "https://uzume.tanukisoftworks.com"
repository = "https://github.com/TanukiSoftworks/Uzume"
license = "GPL-3.0-or-later"

[dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4", features = ["json"] }
urlencoding = "2.1"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
strip = "debuginfo"
